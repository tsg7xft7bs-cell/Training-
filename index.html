<style>
:root{--bg:#e8e8ed;--card:rgba(255,255,255,.58);--fg:#1d1d1f;--mut:#6e6e73;--sep:rgba(0,0,0,.08);--hl:rgba(255,255,255,.75);--fill:rgba(0,0,0,.05);--blue:#0a63c9;--focus:#0071e3;--bt:rgba(10,99,201,.1);--bf:rgba(0,102,204,.82);--green:#248a3d;--orange:#c45500;--red:#d70015;--bar:rgba(250,250,252,.78);--glass:rgba(255,255,255,.52);--gbrd:rgba(255,255,255,.75);--ghl:rgba(255,255,255,.95);--gsh:0 8px 30px rgba(30,40,80,.10);--hero:linear-gradient(160deg,rgba(0,113,227,.20),rgba(120,80,220,.10));--tile:var(--glass);--tfg:var(--fg);--tmut:var(--mut);--tlnk:var(--blue);--tfill:var(--fill);--amb:radial-gradient(60% 40% at 12% 8%,rgba(0,113,227,.16),transparent 70%),radial-gradient(50% 40% at 92% 38%,rgba(150,90,230,.12),transparent 70%),radial-gradient(60% 40% at 20% 92%,rgba(0,170,170,.10),transparent 70%);--fd:"SF Pro Display",system-ui,-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",sans-serif;--ft:"SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",sans-serif;color-scheme:light}
html[data-theme=dark]{--bg:#000;--card:rgba(255,255,255,.07);--fg:#f2f2f5;--mut:#98989f;--sep:rgba(255,255,255,.09);--hl:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);--blue:#5aa9ff;--focus:#4da3ff;--bt:rgba(90,169,255,.14);--bf:rgba(10,120,240,.62);--green:#32c766;--orange:#f0a23a;--red:#ff6b61;--bar:rgba(28,28,32,.74);--glass:rgba(255,255,255,.065);--gbrd:rgba(255,255,255,.13);--ghl:rgba(255,255,255,.22);--gsh:0 10px 34px rgba(0,0,0,.55);--hero:linear-gradient(160deg,rgba(10,120,240,.30),rgba(120,70,210,.14));--tile:var(--glass);--tfg:var(--fg);--tmut:var(--mut);--tlnk:var(--blue);--tfill:var(--fill);--amb:radial-gradient(55% 35% at 10% 6%,rgba(10,100,255,.30),transparent 70%),radial-gradient(45% 35% at 95% 40%,rgba(130,70,220,.22),transparent 70%),radial-gradient(55% 35% at 18% 95%,rgba(0,150,160,.18),transparent 70%);color-scheme:dark}
@media(prefers-color-scheme:dark){html:not([data-theme=light]){--bg:#000;--card:rgba(255,255,255,.07);--fg:#f2f2f5;--mut:#98989f;--sep:rgba(255,255,255,.09);--hl:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);--blue:#5aa9ff;--focus:#4da3ff;--bt:rgba(90,169,255,.14);--bf:rgba(10,120,240,.62);--green:#32c766;--orange:#f0a23a;--red:#ff6b61;--bar:rgba(28,28,32,.74);--glass:rgba(255,255,255,.065);--gbrd:rgba(255,255,255,.13);--ghl:rgba(255,255,255,.22);--gsh:0 10px 34px rgba(0,0,0,.55);--hero:linear-gradient(160deg,rgba(10,120,240,.30),rgba(120,70,210,.14));--tile:var(--glass);--tfg:var(--fg);--tmut:var(--mut);--tlnk:var(--blue);--tfill:var(--fill);--amb:radial-gradient(55% 35% at 10% 6%,rgba(10,100,255,.30),transparent 70%),radial-gradient(45% 35% at 95% 40%,rgba(130,70,220,.22),transparent 70%),radial-gradient(55% 35% at 18% 95%,rgba(0,150,160,.18),transparent 70%);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;min-height:100%}
body::before{content:"";position:fixed;inset:-10%;background:var(--amb);z-index:-1;pointer-events:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#scr{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body{margin:0;background:transparent;position:relative;z-index:0;min-height:100vh;color:var(--fg);font:400 17px/1.47 var(--ft);letter-spacing:-.374px;-webkit-font-smoothing:antialiased;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 150px)}
h1{font:600 34px/1.1 var(--fd);letter-spacing:-.374px;margin:0}
.sub{color:var(--mut);font-size:17px;margin-top:4px}
h2{font:600 21px/1.19 var(--fd);letter-spacing:.231px;color:var(--fg);margin:34px 4px 10px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;transition:transform .15s ease}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--focus);outline-offset:2px}
button[disabled]{opacity:.5}
.group{background:var(--card);border-radius:18px;overflow:hidden;margin:8px 0;box-shadow:0 0 0 1px var(--hl)}
.cell{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;min-height:52px;position:relative;width:100%;text-align:left}
button.cell:active{transform:none;background:var(--fill)}
.cell+.cell::before,.sep::before{content:"";position:absolute;top:0;left:20px;right:0;height:1px;background:var(--sep)}
.cell .r{color:var(--mut);font-size:14px;letter-spacing:-.224px;text-align:right}
.chev::after{content:"›";color:var(--mut);font-size:22px;margin-left:6px;line-height:1}
.btn{display:block;width:100%;background:var(--bf);color:#fff;border-radius:9999px;padding:14px 22px;font-size:17px;font-weight:400;text-align:center;margin-top:14px;min-height:50px}
.btn.gray{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.btn.red{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--sep)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.lnk{color:var(--blue);font-size:17px;padding:6px 0}
.lnk.red{color:var(--red)}
.mut{color:var(--mut)}.sm{font-size:14px;letter-spacing:-.224px;line-height:1.43}
.seg{display:flex;background:var(--fill);border-radius:9999px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 0;border-radius:9999px;font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--hl)}
.seg button:active{transform:none}
.plan{display:block;width:100%;text-align:left;padding:20px;border-radius:18px;background:var(--card);margin:10px 0;box-shadow:inset 0 0 0 1px var(--hl)}
.plan:active{transform:scale(.98)}
.plan.on{box-shadow:inset 0 0 0 2px var(--focus)}
.plan b{font:600 21px/1.19 var(--fd);letter-spacing:.231px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{background:var(--fill);border-radius:9999px;padding:5px 12px;font-size:14px;letter-spacing:-.224px}
.tag.btnt{background:var(--card);color:var(--blue);padding:9px 16px;min-height:38px;box-shadow:inset 0 0 0 1px var(--sep)}
.tag.off{opacity:.45;text-decoration:line-through;color:var(--mut)}
.tag.sel{box-shadow:inset 0 0 0 2px var(--focus);font-weight:600}
button.no{font:inherit;font-weight:600;color:var(--mut);background:var(--fill);border-radius:11px;height:44px;font-size:15px}
button.no.st-RP{color:#fff;background:#8944ab;font-size:11px}button.no.st-F{color:#fff;background:var(--red);font-size:12px}
.rir{display:flex;align-items:center;gap:6px;margin:2px 0 10px 36px;flex-wrap:wrap}.rir span{font-size:14px;color:var(--mut);margin-right:2px}
.rir button{background:var(--card);color:var(--blue);border-radius:9999px;min-width:44px;min-height:38px;padding:7px 10px;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px var(--sep)}
.rirl{margin:0 0 6px 36px}.rirl button{font-size:12px;color:var(--mut)}
.pill{font-size:12px;font-weight:600;letter-spacing:-.12px;padding:2px 9px;border-radius:9999px;margin-left:4px;white-space:nowrap}.pill.up{background:rgba(36,138,61,.12);color:var(--green)}.pill.dn{background:rgba(201,52,0,.1);color:var(--orange)}.pill.n{background:var(--fill);color:var(--mut)}
.more{color:var(--blue);background:var(--fill);border-radius:9999px;width:44px;height:36px;font-size:15px;font-weight:700;letter-spacing:1px;flex:none}
.rv{font-size:15px;font-weight:700;color:#fff}
.calc{margin-top:10px;font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--blue)}.calc:empty{display:none}
.exh{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ex{transition:transform .18s ease}.ex.lift{transition:none;background-color:var(--bg);background-image:linear-gradient(var(--card),var(--card));position:relative;z-index:5;box-shadow:0 0 0 2px var(--blue),0 14px 34px rgba(0,0,0,.28)}
#app.drag .ex[id^=ex]>:not(.exh){display:none}#app.drag .ex[id^=ex]{padding:14px 18px}
.set{transition:transform .15s ease}
.hint,.sug{background:var(--fill);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;letter-spacing:-.224px}
.sug{box-shadow:inset 0 0 0 1px var(--blue)}.sug .row2 .btn{margin-top:8px;min-height:40px;padding:8px 14px;font-size:15px}
.calc{display:flex;align-items:center;gap:10px}.calc span{flex:1;text-align:center}
.kst{width:48px;height:38px;border-radius:9999px;background:var(--fill);color:var(--blue);font-size:22px;font-weight:600;flex:none}
.form input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:12px 0 4px;padding:0;background:transparent;box-shadow:none;border:0}
.form input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9999px;background:var(--fill)}
.form input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.form input[type=range]::-moz-range-track{height:6px;border-radius:9999px;background:var(--fill)}
.form input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}
.fl5{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.swd{display:flex;gap:8px;margin:8px 0}.swd .btn{margin-top:0}
button.no.st-T{color:#fff;background:#c75f00;font-size:11px}
.hero{background:var(--tile);color:var(--tfg);border-radius:18px;padding:28px 24px 24px;margin-top:16px;text-align:center}
.hero .k{color:var(--tmut);font-size:14px;letter-spacing:-.224px}
.hero .t{font:600 34px/1.1 var(--fd);letter-spacing:-.374px;margin:6px 0 8px}
.hero .mut{color:var(--tmut)}.hero .lnk{color:var(--tlnk)}.hero .btn.gray{color:var(--tlnk);box-shadow:inset 0 0 0 1px var(--tlnk)}
.hero .btn{margin-top:20px}.hero .banner{background:var(--tfill);color:var(--tfg);box-shadow:none}
.dots{display:flex;gap:6px;margin-top:6px}.dot{width:10px;height:10px;border-radius:50%;background:var(--fill)}.dot.on{background:var(--blue)}
.ex{padding:20px 18px 14px}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exn{font:600 21px/1.19 var(--fd);letter-spacing:.231px}
.acts{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 2px}
.sh{display:grid;grid-template-columns:30px 1fr 1fr 1fr 44px;gap:8px;font-size:12px;color:var(--mut);letter-spacing:-.12px;margin:14px 0 2px;text-align:center}
.set{display:grid;grid-template-columns:30px 1fr 1fr 1fr 44px;gap:8px;align-items:center;margin:8px 0;text-align:center}
.set .no{font-weight:600;color:var(--mut)}
.set .pv{font-size:14px;letter-spacing:-.224px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{font:inherit;font-size:17px;letter-spacing:-.374px;color:var(--fg);background:var(--fill);border:0;border-radius:11px;padding:11px 10px;width:100%;min-width:0;min-height:44px;outline:none;-webkit-appearance:none;appearance:none}
input{text-align:center}input.t,select{text-align:left;padding:11px 16px}
input.t{border-radius:9999px}
input:focus,textarea:focus,select:focus{box-shadow:inset 0 0 0 2px var(--focus);outline:none}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.8}
.note{margin-top:12px}
.set.done input{background:var(--bt)}
.ck{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--sep);display:grid;place-items:center;margin:auto;color:#fff}
.ck svg{width:20px;height:20px;opacity:0}
.set.done .ck{background:var(--bf);box-shadow:none}.set.done .ck svg{opacity:1}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hl);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs>div{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;padding:8px 0 6px;color:var(--mut);font-size:10px;font-weight:600;letter-spacing:-.08px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button:active{transform:none;opacity:.6}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--blue)}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 1px var(--hl);border-radius:9999px;padding:8px;display:none;align-items:center;gap:6px;z-index:6;white-space:nowrap}
#rest .tm{font:600 22px/1 var(--fd);font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
#rest button{background:var(--fill);border-radius:9999px;padding:10px 14px;font-size:14px;font-weight:600;min-height:40px}
#rest button.go{background:var(--bf);color:#fff}
.banner{background:var(--card);border-radius:18px;padding:14px 18px;margin-top:16px;font-size:14px;letter-spacing:-.224px;line-height:1.43;box-shadow:0 0 0 1px var(--hl)}
.banner.warn{color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.pr{color:var(--green);font-weight:600}
.set.warm .no{font-size:11px;font-weight:600}.set.warm input{color:var(--mut)}
.vb{display:grid;grid-template-columns:1fr 1.3fr 30px;gap:10px;align-items:center;padding:10px 20px;font-size:14px;letter-spacing:-.224px;position:relative}
.vb+.vb::before{content:"";position:absolute;top:0;left:20px;right:0;height:1px;background:var(--sep)}
.bar{height:6px;border-radius:9999px;background:var(--fill);overflow:hidden}.bar i{display:block;height:100%;border-radius:9999px}
.wdots{display:flex;gap:8px}.wdot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mut);background:var(--fill)}
.wdot.pl{color:var(--blue);background:var(--bt)}.wdot.done{background:var(--bf);color:#fff}.wdot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.seg.multi button.on{background:var(--bf);color:#fff;box-shadow:none}
.nav{height:44px;display:flex;align-items:center;margin:-10px 0 4px -6px}
.back{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px;padding:8px 6px;min-height:44px}
.back svg{width:13px;height:21px}
.streak{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px 20px;margin-top:20px;box-shadow:0 0 0 1px var(--hl)}
.streak:active{transform:scale(.98)}
.streak .fl{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--orange);flex:none}
.streak .fl svg{width:24px;height:24px;fill:#fff}
.streak .n{font:600 28px/1 var(--fd);letter-spacing:.196px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px}
.badge{text-align:center;font-size:12px;letter-spacing:-.12px;color:var(--mut)}
.badge .c{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font:600 22px var(--fd);color:var(--mut)}
.badge.on .c{background:var(--orange);color:#fff}
.badge.on{color:var(--fg)}
.badge.t.on .c{background:var(--bf)}
.wdot.mv{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mut)}
.mini{background:var(--fill);border-radius:9999px;width:40px;height:40px;color:var(--blue);font-size:16px}
.steps{counter-reset:s;padding:6px 0}.steps .cell{counter-increment:s;justify-content:flex-start}.steps .cell::after{content:counter(s);order:-1;flex:none;width:28px;height:28px;border-radius:50%;background:var(--bf);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.status{display:flex;align-items:center;gap:8px}.sd{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}.sd.ok{background:var(--green)}.sd.off{background:var(--red)}
svg.ch{width:100%;height:auto;display:block;margin-top:14px}
textarea{font:16px/1.4 ui-monospace,monospace;letter-spacing:0;height:90px;text-align:left;padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.clock{font-variant-numeric:tabular-nums;color:var(--mut)}

/* ---------- Liquid Glass ---------- */
.group,.streak,.plan,.banner,.hero{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 1px var(--gbrd),var(--gsh)}
.group{border-radius:22px}.streak,.plan,.banner{border-radius:22px}
.plan.on{box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 2px var(--focus),var(--gsh)}
.banner.warn{box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 1px var(--red),var(--gsh)}
.hero{background:var(--hero),var(--glass);border-radius:28px;color:var(--fg)}
.hero .banner{background:var(--fill);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn{background:var(--bf);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12),0 6px 18px rgba(0,90,200,.22);font-weight:600}
.btn.gray,.btn.red{background:var(--fill);box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 1px var(--gbrd)}
.tag.btnt,.rir button,.seg button.on,.mini,.more,#rest button:not(.go){background:var(--glass);box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 1px var(--gbrd)}
.seg,.tag{background:var(--fill)}
.tag.sel{box-shadow:inset 0 0 0 2px var(--focus)}
.set.done .ck,.seg.multi button.on,.wdot.done,#rest button.go{background:var(--bf);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tabs{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 8px);max-width:400px;margin:0 auto;border:0;border-radius:9999px;padding:2px 6px;background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 1px var(--gbrd),var(--gsh)}
.tabs button{border-radius:9999px;padding:7px 0 5px;margin:4px 0}
.tabs button.on{background:var(--fill)}
#rest{bottom:calc(88px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 1px var(--gbrd),var(--gsh)}
input,select,textarea{background:var(--fill);box-shadow:inset 0 0 0 1px var(--sep)}
.streak .fl{box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){html:not([data-theme=light]) .group{background:#1c1c1e}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="scr"><div id="app"></div></div>
<div id="rest"><button data-a="rest" data-i="-15">−15</button><span class="tm" id="restt"></span><button data-a="rest" data-i="15">+15</button><button class="go" data-a="rest" data-i="x">Weiter</button></div>
<div class="tabs"><div id="tabs"></div></div>

function vHist(){
  const names=[...new Set(S.sessions.flatMap(s=>s.ex.map(e=>e.n)))];

    const mx=Math.max(...pts),mn=Math.min(...pts),W=480,H=150,pd=12;
    const xy=pts.map((v,i)=>[pd+(pts.length>1?i/(pts.length-1):.5)*(W-2*pd),H-pd-(mx===mn?.5:(v-mn)/(mx-mn))*(H-2*pd)]);
    const line=xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');

  const best={};for(const s of S.sessions)for(const e of s.ex)if(MG[e.n]!=='cardio')for(const x of e.sets)if(!best[e.n]||e1(x)>e1(best[e.n].x))best[e.n]={x,d:s.date};

  return`<h1>Verlauf</h1><div class="sub">${S.sessions.length} Einheiten gespeichert</div>
  <h2>Sätze pro Muskel · diese Woche</h2><div class="group" style="padding:6px 0">${volH}</div>
  <div class="mut sm" style="margin:8px 16px">Richtwert für Muskelaufbau: etwa 10–20 Sätze pro Muskel und Woche. Orange = eher wenig.</div>
  ${S.sessions.length?`<h2>Fortschritt</h2>${chart}<h2>Bestenliste</h2><div class="group">${bl}</div><h2>Einheiten</h2>`:'<div class="group" style="margin-top:20px"><div class="cell mut">Noch keine Einheiten. Nach deinem ersten Training erscheint hier dein Verlauf.</div></div>'}
  ${S.sessions.map(s=>`<div class="group ex"><div class="exh"><div class="exn">${esc(s.day)}</div><span class="mut sm">${dstr(s.date)}</span></div>
    <div class="mut sm">${s.min||0} min · ${fmt(vol(s))} kg${s.wh?' · Strain '+fmt(s.wh.strain)+(s.wh.avg?' · Ø '+s.wh.avg+' bpm':''):''}${s.g&&s.g!=='main'?' · '+esc(gymName((S.gyms||[]).find(g=>g.id===s.g)||{name:'anderes Studio'})):''}</div>

document.addEventListener('click',async ev=>{

    S.custom=S.custom.filter(c=>c.n!==nm).concat([{n:nm,g:cdraft.g,t:cdraft.t||'M'}]);rebuildLib();save();cdraft={g:null,t:'M'};if(pickFor)addPicked(nm);else go('plan',nm+' angelegt.');return}

  if(a==='ttog'){S.noT=S.noT.includes(i)?S.noT.filter(x=>x!==i):[...S.noT,i];const r=fitPlan(S.plan);S.plan=r.plan;msg=r.c?r.c+' Übung(en) im Plan automatisch ersetzt.':'';save();render();return}
  if(a==='startplan'){const p=PLANS.find(x=>x.id===ob.pick);if(!p)return;S.planId=p.id;S.pv=PV;S.plan=fitPlan({name:p.name,d:clone(p.d)}).plan;S.next=0;S.active=null;save();go('train');return}
  if(a==='cancel'){S.active=null;stopRest();lockScreen(false);save();go('train');return}
  if(a==='days'){ob={days:k,pick:null}}
  else if(a==='pick'){ob.pick=i}
  else if(a==='conf'){conf=i}
  else if(a==='noconf'){conf=null}
  else if(a==='move'){const t=moveTarget();if(t){const tk=dkey(new Date()),xk=dkey(t);S.mv.push({f:tk,t:xk,pf:S.ov[tk]||null,pt:S.ov[xk]||null});S.ov[tk]='r';S.ov[xk]='t';save()}}
  else if(a==='unmove'){const tk=dkey(new Date()),m=S.mv.find(x=>x.f===tk);if(m){for(const[k2,v]of[[m.f,m.pf],[m.t,m.pt]]){if(v)S.ov[k2]=v;else delete S.ov[k2]}S.mv=S.mv.filter(x=>x!==m);save()}}
  else if(a==='ck'){const ce=S.active.ex[k],s=ce.sets[j];
    if(!s.done&&s.t==='T'&&!(num(s.reps)>0&&num(s.kg)>0)){msg='Krafttest: trag erst Gewicht und geschaffte Wiederholungen ein.';render();return}
    s.done=!s.done;if(s.done)S.active.formOk=true;
    if(s.done){if(s.t==='T'){s.rir=0;doTest(k,j)}else if(!(S.rirOn&&!ce.cardio))liveSug(k,j);
      startRest(s.t==='RP'?15:S.rest);
      if(S.active.ex[k].sets.every(x=>x.done)&&!(S.rirOn&&!S.active.ex[k].cardio)){const nx=S.active.ex.findIndex((e,q)=>q>k&&e.sets.some(x=>!x.done));if(nx>=0)setTimeout(()=>{const el=$('#ex'+nx);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'})},60)}
    }else{stopRest();if(s.t==='T'){s.rir=null;undoTest(k)}else setRir(s,null);ce.sug=null}save()}
  else if(a==='stype'){const s=S.active.ex[k].sets[j],o=['N','RP','F','T'];if(s.done&&(s.t==='T'||o[(o.indexOf(s.t||'N')+1)%4]==='T'))o.pop();s.t=o[(o.indexOf(s.t||'N')+1)%o.length];delete s.tAuto;if(s.t==='T'&&!s.done)s.reps='';save()}
  else if(a==='rir'){const s=S.active.ex[k].sets[j];setRir(s,n==='x'?null:+n);liveSug(k,j);save();
    const ce=S.active.ex[k];if(ce.sets.every(x=>x.done&&x.rir!=null)){const nx=S.active.ex.findIndex((e,q)=>q>k&&e.sets.some(x=>!x.done));if(nx>=0)setTimeout(()=>{const el=$('#ex'+nx);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'})},60)}}
  else if(a==='exup'||a==='exdown'){const l=S.active.ex,t=a==='exup'?k-1:k+1;if(t>=0&&t<l.length){[l[k],l[t]]=[l[t],l[k]];sw='m'+t;save()}}
  else if(a==='eqm'){const nm=S.active.ex[+n].n;GY().eq[nm]=Object.assign(eqCopy(nm),{m:i});if(i==='p'&&GY().eq[nm].bar==null)GY().eq[nm].bar=0;if(i==='s'&&GY().eq[nm].step==null){GY().eq[nm].start=5;GY().eq[nm].step=5}save()}
  else if(a==='sugok'){const e=S.active.ex[k];if(e.sug){e.sets.forEach((x,q)=>{if(q>=e.sug.j&&!x.done){x.kg=fmt(e.sug.kg);if(e.sug.reps)x.reps=String(e.sug.reps)}});e.sug=null;save()}}
  else if(a==='sugno'){S.active.ex[k].sug=null;save()}
  else if(a==='kstep'){const e=S.active.ex[k],q=e.sets.findIndex(x=>!x.done);if(q>=0){const nv=stepKg(e.n,num(e.sets[q].kg),+n),E1=EM(e.n)[e.n];e.sets.forEach((x,p)=>{if(p>=q&&!x.done){x.kg=fmt(nv);if(E1&&nv>0&&x.t!=='T'){const rp=repsAt(E1.v,nv,x.tr!=null?x.tr:(e.rirT!=null?e.rirT:2));x.reps=String(Math.max(1,Math.min(e.r[1]+5,rp)))}}});e.sug=null;save()}}
  else if(a==='delset'){const e=S.active.ex[k];if(e.sets.length>1){e.sets.splice(j,1);e.sug=null}else msg='Mindestens ein Satz bleibt. Zum Entfernen der Übung: gedrückt halten → Entfernen.';swiped=null;save()}
  else if(a==='noswp'){swiped=null}
  else if(a==='formok'){S.active.formOk=true;save()}
  else if(a==='retest'){const e=S.active.ex[k],q=e.sets.findIndex(x=>!x.done);if(q>=0){e.sets[q].t='T';e.sets[q].reps='';e.test=true;e.tested=false;e.tk='Krafttest';e.tip='Krafttest: bis zum Muskelversagen. Die App rechnet danach die übrigen Sätze neu aus.';sw=null;save()}}
  else if(a==='retestx'){delete EM(n)[n];msg=n+': Beim nächsten Training ist der erste Satz wieder ein Krafttest.';save()}
  else if(a==='eqreset'){delete GY().eq[n];save()}
  else if(a==='gymset'){if(i!==gymId()){S.gymId=i;if(S.active&&!S.active.ex.some(e=>e.sets.some(x=>x.done)))reform();else if(S.active)S.active.ex=S.active.ex.map(e=>e.cardio||e.sets.some(x=>x.done)?e:buildSets({n:e.n,s:e.s0||e.s,r:e.r},S.active.form||3));msg='Aktives Studio: '+gymName(GY())+(S.active?'. Dein laufendes Training wurde angepasst.':'.');save()}}
  else if(a==='gymadd'){const id='g'+Date.now();S.gyms.push({id,name:'Studio '+(S.gyms.length+2),gym:clone(S.gym),plates:S.plates.slice(),eq:{},e1:{}});S.gymId=id;if(S.active&&!S.active.ex.some(e=>e.sets.some(x=>x.done)))reform();msg='Neues Studio angelegt und aktiv. Gib ihm einen Namen und trag die Gewichte ein.';save()}
  else if(a==='gymdel'){const id=gymId();if(id!=='main'){S.gyms=S.gyms.filter(g=>g.id!==id);S.gymId='main';msg='Studio gelöscht. Aktiv ist wieder '+gymName(S)+'.';save()}}
  else if(a==='whon'){whStart();return}
  else if(a==='whsync'){msg='Lade WHOOP-Daten …';render();await whSync(true);if(msg==='Lade WHOOP-Daten …')msg=S.whoop?'WHOOP-Daten aktualisiert.':'Keine WHOOP-Daten erhalten.'}
  else if(a==='whoff'){try{await whCall({action:'disconnect'})}catch(e){}S.whOn=false;S.whoop=null;msg='WHOOP getrennt. Du kannst den Zugriff zusätzlich in der WHOOP-App entfernen.';save()}
  else if(a==='mso'){S.meso.on=i==='an';save()}
  else if(a==='deloadnow'){const d=weekStart();d.setDate(d.getDate()-28);S.meso.start=dkey(d);S.fat=0;msg='Diese Woche ist jetzt Entlastung. Ab Montag startet der nächste Block.';save()}
  else if(a==='mesorestart'){S.meso.start=dkey(nextMon());S.fat=0;msg='Neuer Block startet am Montag. Bis dahin wie gewohnt weiter.';save()}

  else if(a==='wck'){const s=S.active.ex[k].warm[j];s.done=!s.done;if(s.done)startRest(60);else stopRest();save()}
